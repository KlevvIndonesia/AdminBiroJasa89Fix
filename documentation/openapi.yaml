openapi: 3.0.3
info:
  title: Admin SUN89 / SUNBiroJasa REST API
  version: 1.0.0
  description: >
    Complete OpenAPI 3.0.3 specification for the Admin SUN89 / SUNBiroJasa backend.
    Includes all 148 canonical endpoints across 18 modules backed by SQLite 3 (WAL mode, 42 tables, 517 columns).
servers:
  - url: http://localhost:3001
    description: Local Development Backend Server
  - url: http://localhost:3000
    description: Vite Dev Server Proxy (/api)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    publicApiKey:
      type: apiKey
      in: header
      name: X-Public-Api-Key
  schemas:
    StandardSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
    StandardErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Request validation or authorization failed"
paths:
  /api/health:
    get:
      tags:
        - "Health & Readiness"
      summary: "Comprehensive health check probe (verifies SQLite read/write readiness & server status)."
      description: "Auth: Public (No Token) | Roles: All / Unauthenticated | Permissions: None | Main Table: schema_migrations | Related Tables: users"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/health/live:
    get:
      tags:
        - "Health & Readiness"
      summary: "Kubernetes/Process liveness probe (confirms Node.js event loop is responsive)."
      description: "Auth: Public (No Token) | Roles: All / Unauthenticated | Permissions: None | Main Table: NONE (Process Memory) | Related Tables: -"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/health/ready:
    get:
      tags:
        - "Health & Readiness"
      summary: "Readiness probe verifying SQLite WAL connection and schema initialization completion."
      description: "Auth: Public (No Token) | Roles: All / Unauthenticated | Permissions: None | Main Table: schema_migrations | Related Tables: -"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/auth/login:
    post:
      tags:
        - "Authentication"
      summary: "Authenticates user by email/username/employeeId and password; issues signed JWT and updates last_login."
      description: "Auth: Public (Rate-Limited: 20 req / 15m) | Roles: Public (Returns JWT for Admin, SVP, Finance, Messenger) | Permissions: None (Entrypoint) | Main Table: users | Related Tables: employees, messengers, role_permissions, audit_logs, security_audit_logs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"email\"?: string, \"username\"?: string, \"identifier\"?: string, \"password\": string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/auth/me:
    get:
      tags:
        - "Authentication"
      summary: "Returns currently authenticated user profile, employee link, messenger ID (if Messenger), and active role."
      description: "Auth: Bearer JWT (authenticateToken) | Roles: Admin, SVP, Finance, Messenger | Permissions: Authenticated Session | Main Table: users | Related Tables: employees, messengers"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/auth/change-password:
    post:
      tags:
        - "Authentication"
      summary: "Changes password for the authenticated user, increments token_version to invalidate old sessions."
      description: "Auth: Bearer JWT (authenticateToken) | Roles: Admin, SVP, Finance, Messenger | Permissions: Authenticated Session (Self) | Main Table: users | Related Tables: audit_logs, security_audit_logs"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"currentPassword\": string, \"newPassword\": string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders:
    get:
      tags:
        - "Orders"
      summary: "Lists active (non-archived) orders with filtering, search, status, date range, and pagination. Messenger role is automatically scoped to assigned orders."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Finance, Messenger (Scoped) | Permissions: manajemenOrder.view | dashboard.view | tugasLapangan.view | finance.profit.view | finance.penjualan1Thn.view | finance.belumBayar.view | finance.cashback.view | finance.labaRugi.view | Main Table: orders | Related Tables: customers, vehicles, services, samsat_offices, messengers, finance_invoices, order_timeline_processes, messenger_tasks"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
    post:
      tags:
        - "Orders"
      summary: "Creates a new order, upserts customer & vehicle, auto-generates 1:1 finance_invoice, initializes status history & timeline, and records initial DP payment if provided."
      description: "Auth: Bearer JWT + Role + Dynamic RBAC + Idempotency | Roles: Admin, SVP | Permissions: manajemenOrder.create | kalkulator.createOrder | Main Table: orders | Related Tables: customers, vehicles, finance_invoices, invoice_payments, kas_kantor, order_status_history, order_timeline_processes, messenger_tasks, audit_logs, idempotency_keys"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"customerName\": string, \"customerPhone\": string, \"nopol\": string, \"serviceId\": string, \"samsatId\": string, \"biayaPajak\": number, \"biayaJasa\": number, \"uangMuka\"?: number, \"paymentMethodId\"?: string, \"isCostVerified\"?: boolean, ... }"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/stats:
    get:
      tags:
        - "Orders"
      summary: "Returns aggregated order counts by status, payment status, revenue, profit, and completion metrics."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Finance, Messenger | Permissions: dashboard.view | manajemenOrder.view | tugasLapangan.view | finance.profit.view | finance.labaRugi.view | Main Table: orders | Related Tables: finance_invoices"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/archived:
    get:
      tags:
        - "Orders"
      summary: "Lists soft-archived orders (is_archived = 1)."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP | Permissions: arsip.view | manajemenOrder.view | Main Table: orders | Related Tables: customers, vehicles, services, samsat_offices"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/archive:
    get:
      tags:
        - "Orders"
      summary: "Alias endpoint for GET /api/orders/archived (lists archived orders)."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP | Permissions: arsip.view | manajemenOrder.view | Main Table: orders | Related Tables: customers, vehicles, services, samsat_offices"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/archive/clear-all:
    delete:
      tags:
        - "Orders"
      summary: "Permanently deletes or clears all archived orders that have no protected financial ledger dependencies."
      description: "Auth: Bearer JWT + Role + Dynamic RBAC | Roles: Admin, SVP | Permissions: arsip.clearAll | Main Table: orders | Related Tables: order_status_history, order_timeline_processes, order_documents, messenger_tasks, finance_invoices, audit_logs"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/archived/clear-all:
    delete:
      tags:
        - "Orders"
      summary: "Alias for DELETE /api/orders/archive/clear-all."
      description: "Auth: Bearer JWT + Role + Dynamic RBAC | Roles: Admin, SVP | Permissions: arsip.clearAll | Main Table: orders | Related Tables: order_status_history, order_timeline_processes, order_documents, messenger_tasks, finance_invoices, audit_logs"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/vehicle-lookup/{nopol}:
    get:
      tags:
        - "Orders"
      summary: "Looks up existing vehicle & owner details by license plate (nopol) using normalized nopol index."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Finance | Permissions: manajemenOrder.create | manajemenOrder.edit | manajemenOrder.view | kalkulator.view | Main Table: vehicles | Related Tables: customers, orders"
      security:
        - bearerAuth: []
      parameters:
        - name: nopol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/customers/lookup:
    get:
      tags:
        - "Orders"
      summary: "Searches existing customers by name, phone/WA, or NIK for order autocomplete."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Finance | Permissions: manajemenOrder.create | manajemenOrder.edit | manajemenOrder.view | kalkulator.view | Main Table: customers | Related Tables: vehicles"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/check-duplicate:
    post:
      tags:
        - "Orders"
      summary: "Checks whether an active order with the same vehicle nopol and service already exists."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP | Permissions: manajemenOrder.create | manajemenOrder.edit | kalkulator.createOrder | Main Table: orders | Related Tables: vehicles, services"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"nopol\": string, \"serviceId\"?: string, \"excludeOrderNo\"?: string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/{orderNo}:
    get:
      tags:
        - "Orders"
      summary: "Retrieves full order details by orderNo, including customer, vehicle, invoice, payments, timeline, tasks, and documents."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Finance, Messenger (Scoped to assigned) | Permissions: manajemenOrder.view | tugasLapangan.view | arsip.view | finance.profit.view | finance.penjualan1Thn.view | finance.belumBayar.view | finance.cashback.view | finance.labaRugi.view | Main Table: orders | Related Tables: customers, vehicles, services, samsat_offices, messengers, finance_invoices, invoice_payments, order_status_history, order_timeline_processes, messenger_tasks, documents"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
    put:
      tags:
        - "Orders"
      summary: "Updates order details, vehicle/customer attributes, and synchronizes linked invoice amounts and cost verification status."
      description: "Auth: Bearer JWT + Role + Dynamic RBAC | Roles: Admin, SVP | Permissions: manajemenOrder.edit | Main Table: orders | Related Tables: customers, vehicles, finance_invoices, order_status_history, laba_rugi_snapshots, audit_logs"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Partial order update payload (customer, vehicle, service, samsat, cost breakdown, notes)."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
    delete:
      tags:
        - "Orders"
      summary: "Deletes a draft/archived order if and only if no verified financial transactions exist."
      description: "Auth: Bearer JWT + Role + Dynamic RBAC | Roles: Admin, SVP | Permissions: manajemenOrder.delete | arsip.delete | Main Table: orders | Related Tables: finance_invoices, order_status_history, order_timeline_processes, order_documents, messenger_tasks, audit_logs"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/{orderNo}/history:
    get:
      tags:
        - "Orders"
      summary: "Retrieves chronological status history entries for an order."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Finance, Messenger | Permissions: manajemenOrder.view | tugasLapangan.view | arsip.view | Main Table: order_status_history | Related Tables: orders, users"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/{orderNo}/status:
    patch:
      tags:
        - "Orders"
      summary: "Transitions order lifecycle status (e.g., Draft -> Diproses -> Selesai / Dibatalkan) with state machine guards."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Finance, Messenger (Scoped) | Permissions: manajemenOrder.changeStatus | tugasLapangan.updateStatus | Main Table: orders | Related Tables: order_status_history, finance_invoices, laba_rugi_snapshots, notification_logs, audit_logs"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"status\": string, \"notes\"?: string, \"cancellationReason\"?: string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/{orderNo}/payment:
    patch:
      tags:
        - "Orders"
      summary: "Updates order payment status / down payment and synchronizes with finance_invoices and invoice_payments."
      description: "Auth: Bearer JWT + Role + Dynamic RBAC | Roles: Admin, SVP, Finance | Permissions: manajemenOrder.edit | finance.belumBayar.pay | Main Table: orders | Related Tables: finance_invoices, invoice_payments, kas_kantor, payment_methods, audit_logs"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"uangMuka\"?: number, \"paymentStatus\"?: string, \"paymentMethodId\"?: string, \"proofDocId\"?: string, \"notes\"?: string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/{orderNo}/assign-messenger:
    patch:
      tags:
        - "Orders"
      summary: "Assigns or reassigns a field Messenger to an order and creates/updates messenger_tasks."
      description: "Auth: Bearer JWT + Role + Dynamic RBAC | Roles: Admin, SVP | Permissions: manajemenOrder.assignMessenger | Main Table: orders | Related Tables: messengers, employees, messenger_tasks, order_status_history, audit_logs"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"messengerId\": string, \"taskType\"?: string, \"notes\"?: string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
  /api/orders/{orderNo}/tasks/{taskType}/status:
    post:
      tags:
        - "Orders"
      summary: "Updates the execution status of a specific messenger field task on an order."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Messenger (Assigned) | Permissions: tugasLapangan.updateStatus | manajemenOrder.edit | Main Table: messenger_tasks | Related Tables: orders, order_timeline_processes, messengers, audit_logs"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - name: taskType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"status\": \"PENDING\" | \"IN_PROGRESS\" | \"COMPLETED\" | \"CANCELLED\", \"notes\"?: string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (RBAC Policy)
    patch:
      tags:
        - "Orders"
      summary: "PATCH alias for updating a specific messenger task status on an order."
      description: "Auth: Bearer JWT + Dynamic RBAC | Roles: Admin, SVP, Messenger (Assigned) | Permissions: tugasLapangan.updateStatus | manajemenOrder.edit | Main Table: messenger_tasks | Related Tables: orders, order_timeline_processes, messengers, audit_logs"
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - name: taskType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "{ \"status\": string, \"notes\"?: string }"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
